<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ironveil: Three Banners</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #050911; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .panel { background: #0b121f; border: 1px solid #1e293b; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-[#090f1a] border-b border-slate-800 px-4 py-2 flex items-center justify-between">
    <h1 id="title" class="text-lg font-bold text-white">Ironveil: Three Banners</h1>
    <div id="status" class="text-xs text-slate-400"></div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <main class="flex-1 flex flex-col min-w-0">
      <div id="map-tabs" class="flex gap-1 p-2 bg-[#0b121f] border-b border-slate-800 overflow-x-auto"></div>
      <div class="flex-1 relative bg-[#050911]">
        <canvas id="radar" class="w-full h-full block"></canvas>
      </div>
    </main>
    <aside class="w-72 bg-[#0b121f] border-l border-slate-800 p-3 text-xs text-slate-400 overflow-y-auto">
      <div class="font-semibold text-slate-200 mb-2">Inspektur</div>
      <div id="inspector">Klik karakter di radar.</div>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
