<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ironveil: Three Banners</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #050911; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .panel { background: #0b121f; border: 1px solid #1e293b; }
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #050911; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-hidden">
  
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <header class="bg-[#090f1a] border-b border-slate-800 px-4 py-2 flex items-center justify-between relative z-10 shrink-0">
    <div class="flex items-center gap-4">
      <h1 id="title" class="text-lg font-bold text-white">Ironveil: Three Banners</h1>
      <button id="btnTestWar" class="px-3 py-1 bg-red-600 hover:bg-red-500 text-white rounded text-xs font-bold transition">🔥 Tes War</button>
      <button id="btnReset" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-white rounded text-xs font-bold transition">↺ Reset</button>
    </div>
    
    <div class="flex items-center gap-4 text-xs font-mono">
      <!-- Jam & Hari -->
      <div class="flex flex-col text-right">
        <span class="text-slate-400">Hari <strong id="hud-day" class="text-white">1</strong></span>
        <span id="hud-time" class="text-sky-300">00:00</span>
      </div>
      
      <div class="h-6 w-px bg-slate-700"></div>

      <!-- Countdown War / Durasi Perang -->
      <div class="flex flex-col text-right">
        <span id="hud-war-label" class="text-slate-400">War Berikutnya</span>
        <span id="hud-war-countdown" class="text-amber-400 font-bold">10:00</span>
      </div>

      <div class="h-6 w-px bg-slate-700"></div>

      <!-- Status War & Juara -->
      <div class="flex flex-col text-right">
        <span id="hud-war-status" class="text-emerald-400 font-bold">DAMAI</span>
        <span id="hud-champion" class="text-slate-400">Juara: -</span>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- KIRI: RADAR -->
    <main class="flex-1 flex flex-col min-w-0 relative">
      <div id="map-tabs" class="flex gap-1 p-2 bg-[#0b121f] border-b border-slate-800 overflow-x-auto shrink-0 z-10"></div>
      
      <div id="chip-hp-bars" class="absolute top-14 left-1/2 -translate-x-1/2 flex gap-4 z-20 hidden">
        <div class="w-32 bg-slate-800/80 rounded p-1 border border-red-500 shadow-lg">
          <div class="text-[10px] text-red-400 text-center font-bold">Axion</div>
          <div class="w-full bg-slate-900 h-2 rounded mt-1"><div id="chip-bar-axion" class="bg-red-500 h-2 rounded transition-all" style="width:100%"></div></div>
        </div>
        <div class="w-32 bg-slate-800/80 rounded p-1 border border-sky-500 shadow-lg">
          <div class="text-[10px] text-sky-400 text-center font-bold">Belvian</div>
          <div class="w-full bg-slate-900 h-2 rounded mt-1"><div id="chip-bar-belvian" class="bg-sky-500 h-2 rounded transition-all" style="width:100%"></div></div>
        </div>
        <div class="w-32 bg-slate-800/80 rounded p-1 border border-purple-500 shadow-lg">
          <div class="text-[10px] text-purple-400 text-center font-bold">Cyra</div>
          <div class="w-full bg-slate-900 h-2 rounded mt-1"><div id="chip-bar-cyra" class="bg-purple-500 h-2 rounded transition-all" style="width:100%"></div></div>
        </div>
      </div>

      <div class="flex-1 relative bg-[#050911]">
        <canvas id="radar" class="w-full h-full block"></canvas>
      </div>
    </main>

        <!-- KANAN: TABBED DASHBOARD -->
    <aside class="w-[340px] bg-[#0b121f] border-l border-slate-800 flex flex-col h-full shrink-0">
      <!-- Tab Navigation -->
      <div class="flex border-b border-slate-800 bg-[#090f1a] overflow-x-auto shrink-0">
        <button data-tab="inspector" class="tab-btn px-3 py-2 text-[11px] font-bold text-sky-400 border-b-2 border-sky-400 whitespace-nowrap">Inspektur</button>
        <button data-tab="politik" class="tab-btn px-3 py-2 text-[11px] font-bold text-slate-500 hover:text-slate-300 whitespace-nowrap">Politik</button>
        <button data-tab="hall" class="tab-btn px-3 py-2 text-[11px] font-bold text-slate-500 hover:text-slate-300 whitespace-nowrap">Hall of Fame</button>
        <button data-tab="log" class="tab-btn px-3 py-2 text-[11px] font-bold text-slate-500 hover:text-slate-300 whitespace-nowrap">Log</button>
        <button data-tab="chat" class="tab-btn px-3 py-2 text-[11px] font-bold text-slate-500 hover:text-slate-300 whitespace-nowrap">Chat</button>
      </div>

      <!-- Tab Content (Menggunakan Grid agar tinggi otomatis penuh) -->
      <div class="flex-1 grid overflow-hidden relative">
        
        <!-- Inspektur -->
        <div id="tab-inspector" class="tab-content overflow-y-auto p-3" style="grid-area: 1 / 1;">
          <div id="inspector" class="text-xs text-slate-300 bg-[#050911] p-3 rounded border border-slate-800 min-h-[100px]">
            Klik karakter/monster di radar.
          </div>
        </div>

        <!-- Politik -->
        <div id="tab-politik" class="tab-content overflow-y-auto p-3 hidden" style="grid-area: 1 / 1;">
          <div id="council-panel" class="text-xs space-y-2"></div>
        </div>

        <!-- Hall of Fame -->
        <div id="tab-hall" class="tab-content overflow-y-auto p-3 hidden" style="grid-area: 1 / 1;">
          <div id="hall-of-fame" class="text-xs space-y-1"></div>
        </div>

        <!-- Log -->
        <div id="tab-log" class="tab-content overflow-y-auto p-3 hidden" style="grid-area: 1 / 1;">
          <div id="world-log" class="space-y-1 text-[11px] font-mono"></div>
        </div>

        <!-- Chat -->
        <div id="tab-chat" class="tab-content overflow-y-auto p-3 hidden" style="grid-area: 1 / 1;">
          <div id="chat-feed" class="space-y-1 text-[11px] font-mono"></div>
        </div>

      </div>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
